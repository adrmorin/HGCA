<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Certificado CI HCGA</title>
<link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@1,700;1,800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="st">
/* Layout: barra de herramientas fija + hoja carta (el certificado) a la izquierda + hoja del equipo a la derecha; se apilan en móvil. */
:root{
  --bg:#ECEAE8; --surface:#FFFFFF; --fg:#1B1919; --muted:#5E5858; --line:#D6D1CE; --accent:#890000; --accent-fg:#FFFFFF; --chip:#F6E9E9; --chip-fg:#6B0000; --ok:#1F6B3A; --warn:#8A5A00;
  /* La hoja es papel: se mantiene clara en ambos temas a propósito */
  --paper:#FFFFFF; --ink:#111111; --ink-2:#4D4D4D; --rule:#D9D4D1; --tint:#F3F1F0; --red:#890000; --red-deep:#6B0000;
  --f-display:"Saira","Arial Narrow",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111111; --surface:#1C1B1B; --fg:#EFEBE9; --muted:#A9A1A0; --line:#332F2F; --accent:#EF5350; --accent-fg:#111111; --chip:#3A1F1F; --chip-fg:#FFB4B0; --ok:#7BD495; --warn:#E8B95A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111111; --surface:#1C1B1B; --fg:#EFEBE9; --muted:#A9A1A0; --line:#332F2F; --accent:#EF5350; --accent-fg:#111111; --chip:#3A1F1F; --chip-fg:#FFB4B0; --ok:#7BD495; --warn:#E8B95A; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px}
.bar-in{max-width:880px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.bar h1{margin:0;font:800 italic 18px/1 var(--f-display);letter-spacing:.01em;display:flex;gap:8px;align-items:baseline}
.bar h1 small{font:500 11px var(--f-mono);color:var(--muted);font-style:normal;letter-spacing:.04em}
.grp{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.grp button{border:0;background:transparent;color:var(--fg);padding:6px 11px;font-size:13px}
.grp button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:6px 12px;font-size:13px}
.btn.edit[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.status{font-size:12px;color:var(--muted);min-width:0}
.status.dirty{color:var(--warn)} .status.ok{color:var(--ok)}

.wrap{max-width:880px;margin:0 auto;padding-block:24px 48px;padding-inline:16px}
.hint{grid-column:1/-1;margin:0;font-size:13px;color:var(--muted)}
.hint b{color:var(--fg)}

/* ---------- Hoja del certificado ---------- */
.paperbox{min-width:0;overflow-x:auto}
.sheet{position:relative;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:10.5px;line-height:1.5;max-width:816px;margin:0 auto;padding:38px 46px 30px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 10px 30px rgba(0,0,0,.10);border-top:6px solid var(--red)}
.sheet .frame{position:absolute;inset:14px;border:1px solid var(--rule);pointer-events:none}
.s-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.mark{display:flex;flex-direction:column;line-height:1}
.mark img{display:block;width:220px;max-width:100%;height:auto}
.mark .w{font:800 italic 30px/1 var(--f-display);color:var(--ink);letter-spacing:.02em}
.mark .w i{color:var(--red);font-style:inherit}
.mark .s{font:600 8.5px/1 var(--f-body);letter-spacing:.32em;color:var(--ink-2);margin-top:4px}
.recno{text-align:right}
.lbl{font:600 7.5px/1.3 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.val{font:500 10.5px/1.4 var(--f-mono);color:var(--ink);word-break:break-word}
.s-title{text-align:center;margin:20px 0 16px}
.eyebrow{font:700 8px/1 var(--f-body);letter-spacing:.24em;text-transform:uppercase;color:var(--red)}
.s-title h2{margin:8px 0 6px;font:800 italic 27px/1.05 var(--f-display);text-transform:uppercase;color:var(--ink);text-wrap:balance}
.s-title p{margin:0 auto;max-width:56ch;color:var(--ink-2);font-size:10px}
.meta{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:16px;background:var(--tint);border:1px solid var(--rule);padding:14px 16px;margin-bottom:16px}
.meta .rows{display:grid;gap:8px;min-width:0}
.state{display:inline-flex;gap:6px;align-items:center;font:600 9px/1 var(--f-body);letter-spacing:.06em;color:var(--red-deep);border:1px solid var(--red);padding:4px 7px;border-radius:3px;background:var(--paper)}
.state::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red)}
.note{font-size:9px;color:var(--ink-2);margin:2px 0 0}
.qr{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.qr .box{width:104px;height:104px;border:1.5px dashed var(--ink-2);display:grid;place-items:center;font:500 10px var(--f-mono);color:var(--ink-2);background:var(--paper)}
.qr .u{font:400 8px/1.3 var(--f-mono);color:var(--ink-2);word-break:break-all}
.sec{margin-top:14px}
.sec-h{display:flex;gap:10px;align-items:baseline;border-bottom:1px solid var(--rule);padding-bottom:4px;margin-bottom:8px}
.sec-h .n{font:800 italic 13px/1 var(--f-display);color:var(--red);min-width:16px}
.sec-h h3{margin:0;font:700 8.5px/1 var(--f-body);letter-spacing:.18em;text-transform:uppercase;color:var(--ink)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 24px}
.fields .full{grid-column:1/-1}
.field{display:grid;gap:2px;border-bottom:1px dotted var(--rule);padding-bottom:5px;min-width:0}
.cl p{margin:0;max-width:none}
.cl + .cl{margin-top:8px}
.cl .ch{font-weight:700;color:var(--ink)}
.box-nb{background:var(--tint);border-left:3px solid var(--red);padding:8px 10px}
.consents{margin-top:6px;font-size:9.5px;color:var(--ink-2)}
.signs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;margin-top:20px}
.sign{border-top:1px solid var(--ink);padding-top:6px;text-align:center;display:grid;gap:3px}
.s-foot{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;border-top:1px solid var(--rule);margin-top:16px;padding-top:8px;font-size:8.5px;color:var(--ink-2)}
.s-foot .val{font-size:9.5px}
.ph{font:500 .92em var(--f-mono);background:#F6E9E9;color:#6B0000;border-radius:3px;padding:0 3px;white-space:nowrap}
.ex{background:#FFF6D6;border-radius:2px;padding:0 2px;box-shadow:inset 0 -1px 0 #E3C766}
.ribbon{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:#8A5A00;color:#fff;font:700 8.5px/1 var(--f-body);letter-spacing:.16em;padding:5px 10px;text-transform:uppercase;white-space:nowrap}
[data-k],[data-team]{border-radius:2px}
.editing [data-k],.editing [data-team]{outline:1px dashed #C9A0A0;outline-offset:2px;cursor:text;background:rgba(137,0,0,.035)}
.editing [data-k]:focus,.editing [data-team]:focus{outline:2px solid #890000;background:#FFF8F8}
/* Responsive: carta completa en escritorio, márgenes reducidos en tableta, una columna y texto más grande en móvil */
.s-title h2{font-size:clamp(21px,4.4vw,27px)}
@media (max-width:860px){
  .wrap{padding-block:16px 32px}
  .sheet{padding:32px 30px 26px}
  .sheet .frame{inset:10px}
}
@media (max-width:640px){
  .wrap{padding-block:12px 24px}
  .sheet{padding:26px 20px 20px;font-size:13px;line-height:1.55;border-top-width:5px}
  .sheet .frame{inset:7px}
  .s-head{flex-direction:column;align-items:flex-start;gap:12px}
  .mark img{width:min(240px,100%)}
  .recno{text-align:left;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .lbl{font-size:9.5px;letter-spacing:.12em}
  .val{font-size:12.5px}
  .eyebrow{font-size:9.5px;letter-spacing:.18em;line-height:1.4}
  .s-title{margin:16px 0 14px}
  .s-title p{font-size:12.5px}
  .meta{grid-template-columns:minmax(0,1fr);padding:14px;gap:14px}
  .state{font-size:11px;line-height:1.3;white-space:normal}
  .note{font-size:11.5px}
  .qr{flex-direction:row;text-align:left;justify-content:flex-start;align-items:center;gap:12px;border-top:1px solid var(--rule);padding-top:12px}
  .qr .box{width:84px;height:84px;flex:none}
  .qr .u{font-size:10.5px}
  .sec{margin-top:18px}
  .sec-h h3{font-size:10.5px;line-height:1.3}
  .sec-h .n{font-size:15px}
  .fields,.signs{grid-template-columns:minmax(0,1fr)}
  .fields{gap:10px}
  .cl + .cl{margin-top:12px}
  .box-nb{padding:10px 12px}
  .consents{font-size:12px}
  .signs{gap:18px;margin-top:22px}
  .s-foot{flex-direction:column;align-items:flex-start;gap:10px;font-size:11px}
  .s-foot > div{text-align:left!important}
  .ph{white-space:normal;word-break:break-all}
}
@media (max-width:380px){
  .sheet{padding:22px 16px 18px}
  .qr{flex-direction:column;align-items:flex-start}
}


@media (prefers-reduced-motion:no-preference){.btn,.grp button{transition:background .15s,color .15s,border-color .15s}}

      if(editable) return '<'+tag+attrs+' contenteditable="plaintext-only" spellcheck="true">'+esc(T[key])+'</'+tag+'>';
      return '<'+tag+(cls?' class="'+cls+'"':'')+(mode==="raw"?'':' data-k="'+key+'"')+'>'+fill(T[key], mode, lang)+'</'+tag+'>';
    }
    function field(lk, vk, full){ return '<div class="field'+(full?' full':'')+'">'+k(lk,"div","lbl")+k(vk,"div","val")+'</div>'; }
    function clause(n){ return '<div class="cl"><p>'+k("c"+n+"_h","span","ch")+' '+k("c"+n,"span","")+'</p></div>'; }
    var qrInner = mode==="raw" ? "{{QR}}" : (mode==="example" ? "QR" : '<span class="ph">{{QR}}</span>');
    var url = fill("{{URL_VERIFICACION}}", mode, lang);
    return ''+
    '<article class="sheet" lang="'+lang+'">'+
      '<div class="frame"></div>'+
      (mode==="example" ? '<div class="ribbon">'+(lang==="es"?"Datos de ejemplo":"Sample data")+'</div>' : '')+
      '<header class="s-head">'+
        '<div class="mark"><img src="'+LOGO+'" alt="HCGA Trading LLC" width="220" height="48"></div>'+
        '<div class="recno">'+k("rec_label","div","lbl")+'<div class="val">'+fill("{{CUI}}",mode,lang)+'</div></div>'+
      '</header>'+
      '<div class="s-title">'+k("eyebrow","div","eyebrow")+k("title","h2","")+k("subtitle","p","")+'</div>'+
      '<section class="meta">'+
        '<div class="rows">'+
          '<div>'+k("m_cui","div","lbl")+'<div class="val">'+fill("{{CUI}}",mode,lang)+'</div></div>'+
          '<div>'+k("m_date","div","lbl")+k("v_date","div","val")+'</div>'+
          '<div>'+k("m_state","div","lbl")+'<div style="margin-top:3px">'+k("v_state","span","state")+'</div>'+k("m_state_note","p","note")+'</div>'+
        '</div>'+
        '<div class="qr"><div class="box">'+qrInner+'</div><div>'+k("qr_label","div","lbl")+'<div class="u">'+url+'</div></div></div>'+
      '</section>'+
      '<section class="sec"><div class="sec-h"><span class="n">I</span>'+k("s1_h","h3","")+'</div>'+
        '<div class="fields">'+field("f_issuer","v_issuer")+field("f_reg","v_reg")+field("f_contact","v_contact",true)+'</div></section>'+
      '<section class="sec"><div class="sec-h"><span class="n">II</span>'+k("s2_h","h3","")+'</div>'+
        '<div class="fields">'+field("f_name","v_name",true)+field("f_role","v_role")+field("f_id","v_id")+field("f_mail","v_mail",true)+'</div></section>'+
      '<section class="sec"><div class="sec-h"><span class="n">III</span>'+k("s3_h","h3","")+'</div>'+
        clause(1)+clause(2)+'<div class="cl box-nb"><p>'+k("c3_h","span","ch")+' '+k("c3","span","")+'</p></div>'+clause(4)+
        '<div class="cl"><p>'+k("c5_h","span","ch")+' '+k("c5","span","")+'</p>'+k("c5b","p","consents")+'</div>'+
        clause(6)+clause(7)+
      '</section>'+
      '<div class="signs">'+
        '<div class="sign">'+k("sig_issuer","div","lbl")+k("hash_label","div","lbl")+k("v_hash","div","val")+'</div>'+
        '<div class="sign">'+k("sig_accept","div","lbl")+k("v_accept","div","val")+'</div>'+
      '</div>'+
      '<footer class="s-foot">'+k("foot","span","")+'<div style="text-align:right">'+k("foot_ver","div","lbl")+'<div class="val">'+fill("{{CUI}}",mode,lang)+'</div></div></footer>'+
    '</article>';
  }

  // Solo la hoja. Idioma: español por defecto; añade #en al enlace para la versión en inglés.
  var app = document.getElementById("app");
  function render(){
    var lang = (location.hash||"").toLowerCase()==="#en" ? "en" : "es";
    document.documentElement.lang = lang;
    app.innerHTML = '<main class="wrap"><div class="paperbox">'+cert(lang, "markers", false)+'</div></main>';
  }
  window.addEventListener("hashchange", render);
  render();
})();
</script>
</body></html>
